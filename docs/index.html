<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>NBA Prop Predictor — 2-leg slate</title>
  <link rel="stylesheet" href="slate.css?v=PAGES_ASSET_VERSION" />
</head>
<body>
  <div class="page">
    <header class="slate-header">
      <div class="slate-header-row">
        <h1 class="slate-title">NBA PROP PREDICTOR</h1>
        <nav class="main-nav" role="navigation" aria-label="Main">
          <div class="main-nav-inner">
            <button type="button" class="nav-tab active" id="navPairs" data-view="pairs">Top Pairs</button>
            <button type="button" class="nav-tab" id="navPlayers" data-view="players">All Players</button>
          </div>
        </nav>
      </div>
    </header>
    <section id="sectionPairs" class="view-section" aria-labelledby="navPairs">
      <div class="toolbar book-toolbar">
        <div class="book-filter" role="group" aria-label="Bookmaker">
          <button type="button" id="bookPrizePicks" class="book-btn active" data-book="prizepicks">PrizePicks</button>
          <button type="button" id="bookUnderdog" class="book-btn" data-book="underdog">Underdog</button>
        </div>
      </div>
      <div id="cards"><p class="load-msg" id="loadMsg">Loading slate…</p></div>
    </section>
    <section id="sectionPlayers" class="view-section" hidden aria-labelledby="navPlayers">
      <div class="players-toolbar">
        <div class="players-search-group">
          <label class="player-search-label" for="playerSearch">Search player</label>
          <input type="search" id="playerSearch" class="player-search" placeholder="Search by player name…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="stat-filter-divider" aria-hidden="true"></div>
        <div class="stat-filter" role="group" aria-label="Filter by stat">
          <button type="button" class="stat-pill" data-stat="ALL" aria-pressed="true">All</button>
          <button type="button" class="stat-pill" data-stat="PTS" aria-pressed="false">Pts</button>
          <button type="button" class="stat-pill" data-stat="AST" aria-pressed="false">Ast</button>
          <button type="button" class="stat-pill" data-stat="REB" aria-pressed="false">Rebs</button>
        </div>
      </div>
      <div id="playersPanel"></div>
    </section>
  </div>
  <script src="slate.js?v=PAGES_ASSET_VERSION"></script>
</body>
</html>
