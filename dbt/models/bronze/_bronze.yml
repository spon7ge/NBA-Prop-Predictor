version: 2

models:
  - name: bronze_games
    description: >
      One row per NBA game (from gamelogs) plus Odds-API events when present.
      Light cleanup only — typed dates and consistent column names.
    columns:
      - name: game_id
        description: NBA game id (10-digit string) when sourced from gamelogs.
      - name: event_id
        description: Odds-API event id when sourced from raw.games.
      - name: game_date
        description: Calendar date of the game (DATE).
      - name: commence_at
        description: Game start timestamp from Odds-API (TIMESTAMPTZ).
      - name: home_team
        description: Home team name or abbreviation.
      - name: away_team
        description: Away team name or abbreviation.
      - name: season_year
        description: NBA season label (e.g. 2025-26).
      - name: source
        description: Row origin — gamelogs or odds_api.
      - name: fetched_at
        description: Last time the raw row was written.

  - name: bronze_player_props
    description: >
      Union of raw.props_dfs and raw.props_us with consistent names and types.
    columns:
      - name: bookmaker
        tests: [not_null]
      - name: market_category
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: side
        description: over or under (lowercase).
      - name: game_date
        description: Slate date (DATE).
      - name: line
        description: Prop line (DOUBLE PRECISION).
      - name: odds
        description: American odds (INTEGER).
      - name: prop_source
        description: dfs or us — which raw table the row came from.
