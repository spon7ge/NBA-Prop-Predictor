<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  
  <!-- Outer glow ring -->
  <circle cx="32" cy="30" r="22" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
  <!-- Main hoop -->
  <circle cx="32" cy="30" r="17" fill="none" stroke="white" stroke-width="2.5"/>
  
  <!-- Rising chart inside hoop -->
  <polyline points="20,37 25,29 30,32 36,22 42,19" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- End dot -->
  <circle cx="42" cy="19" r="2.5" fill="white"/>
  
  <!-- Net lines -->
  <line x1="32" y1="47" x2="32" y2="56" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="26" y1="47" x2="29" y2="56" stroke="white" stroke-width="1" opacity="0.35"/>
  <line x1="38" y1="47" x2="35" y2="56" stroke="white" stroke-width="1" opacity="0.35"/>
  
  <!-- Backboard -->
  <rect x="18" y="7" width="28" height="3.5" rx="1" fill="none" stroke="white" stroke-width="1.8"/>
  <line x1="32" y1="10.5" x2="32" y2="15" stroke="white" stroke-width="2"/>
</svg>
