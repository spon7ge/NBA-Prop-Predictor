<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="HoopVista pipeline architecture">
  <rect width="960" height="420" fill="#0b0b0b"/>
  <text x="32" y="36" fill="#e8e8e4" font-family="system-ui,sans-serif" font-size="18" font-weight="600">HoopVista pipeline</text>
  <text x="32" y="58" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="12">ingest ’ silver ’ live props ’ live slates ’ FastAPI ’ dashboard</text>

  <!-- boxes -->
  <rect x="32" y="90" width="140" height="70" rx="10" fill="#141414" stroke="#2e2e2c"/>
  <text x="102" y="122" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Sources</text>
  <text x="102" y="142" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">nba-api · Odds API</text>

  <rect x="210" y="90" width="140" height="70" rx="10" fill="#141414" stroke="#2e2e2c"/>
  <text x="280" y="122" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">raw.*</text>
  <text x="280" y="142" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">NBA + WNBA upserts</text>

  <rect x="388" y="90" width="140" height="70" rx="10" fill="#141414" stroke="#2e2e2c"/>
  <text x="458" y="122" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">silver.*</text>
  <text x="458" y="142" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">gamelog merge</text>

  <rect x="566" y="90" width="160" height="70" rx="10" fill="#141414" stroke="#3a4a6a"/>
  <text x="646" y="122" text-anchor="middle" fill="#d0d8e8" font-family="system-ui,sans-serif" font-size="12" font-weight="600">live ML</text>
  <text x="646" y="142" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">props ’ slates</text>

  <rect x="764" y="90" width="164" height="70" rx="10" fill="#141414" stroke="#2e2e2c"/>
  <text x="846" y="122" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Serve</text>
  <text x="846" y="142" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">FastAPI + React</text>

  <!-- arrows top row -->
  <path d="M172 125 H210" stroke="#5a5a55" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 125 H388" stroke="#5a5a55" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M528 125 H566" stroke="#5a5a55" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M726 125 H764" stroke="#5a5a55" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- lower batch path -->
  <rect x="388" y="220" width="338" height="70" rx="10" fill="#101010" stroke="#2e2e2c"/>
  <text x="557" y="252" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Batch (manual): dbt gold ’ train ’ ml.predictions</text>
  <text x="557" y="272" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">research / historical slate  not on daily Airflow DAG</text>
  <path d="M458 160 V220" stroke="#5a5a55" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- orchestration -->
  <rect x="32" y="320" width="896" height="64" rx="10" fill="#101010" stroke="#2e2e2c"/>
  <text x="480" y="348" text-anchor="middle" fill="#c8c8c0" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Orchestration: Airflow hoopvista_daily_pipeline (3× daily) · Docker Compose ETL profile</text>
  <text x="480" y="368" text-anchor="middle" fill="#8e8e86" font-family="system-ui,sans-serif" font-size="11">Postgres (local :5433 or Supabase) is the single source of truth for the API</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a5a55"/>
    </marker>
  </defs>
</svg>
