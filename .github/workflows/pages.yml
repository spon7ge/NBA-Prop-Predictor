name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Update last updated timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s/BUILD_TIMESTAMP/$TIMESTAMP/g" docs/index.html
      
      - name: Copy EV data (CSV + 2-leg JSON slates) to docs folder
        run: |
          mkdir -p docs/data/props/ev_analysis
          cp data/props/ev_analysis/prizepicks.csv docs/data/props/ev_analysis/prizepicks.csv
          cp data/props/ev_analysis/underdog.csv docs/data/props/ev_analysis/underdog.csv
          cp data/props/ev_analysis/prizepicks.json docs/data/props/ev_analysis/prizepicks.json
          cp data/props/ev_analysis/underdog.json docs/data/props/ev_analysis/underdog.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4