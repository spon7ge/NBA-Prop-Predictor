<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="HV_ICON.png">
  <meta name="theme-color" content="#0d0d0d" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>HoopVista - The Best Research Tool for NBA DFS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="slate.css?v=PAGES_ASSET_VERSION" />
</head>
<body>
  <div class="page">
    <header class="slate-header">
      <div class="slate-header-row">
        <h1 class="slate-title">
          <a href="index.html" class="slate-title-link">HoopVista</a>
        </h1>
        <nav class="header-links slate-header-links" aria-label="Site navigation">
          <a href="blog.html" class="header-link">Blog</a>
          <a href="faq.html" class="header-link">FAQ</a>
          <button type="button" class="header-link" id="navPairs" data-view="pairs" aria-current="page">
            Top Pairs
          </button>
          <button type="button" class="header-link" id="navPlayers" data-view="players">All Players</button>
        </nav>
      </div>
    </header>
    <section id="sectionPairs" class="view-section" aria-labelledby="headingPairs">
      <header class="view-section-head view-section-head--pairs">
        <h2 class="view-section-title" id="headingPairs">Top Pairs</h2>
      </header>
      <div class="toolbar book-toolbar">
        <div class="book-filter">
          <label class="book-filter-label" id="bookFilterLabel" for="bookDropdownTrigger">Book</label>
          <div class="book-dropdown" id="bookDropdown">
            <button
              type="button"
              class="book-dropdown-trigger"
              id="bookDropdownTrigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="bookDropdownMenu"
            >
              <span class="book-dropdown-value" id="bookDropdownValue">PrizePicks</span>
              <span class="book-dropdown-chevron" aria-hidden="true"></span>
            </button>
            <div
              class="book-dropdown-menu"
              id="bookDropdownMenu"
              role="listbox"
              hidden
              aria-labelledby="bookFilterLabel"
            >
              <button type="button" class="book-dropdown-option" role="option" data-book="prizepicks">
                PrizePicks
              </button>
              <button type="button" class="book-dropdown-option" role="option" data-book="underdog">
                Underdog
              </button>
              <button type="button" class="book-dropdown-option" role="option" data-book="draftkings">
                DraftKings Pick 6
              </button>
              <button type="button" class="book-dropdown-option" role="option" data-book="betr">
                Betr
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="cards"><p class="load-msg" id="loadMsg">Loading slate…</p></div>
    </section>
    <section id="sectionPlayers" class="view-section" hidden aria-labelledby="headingPlayers">
      <header class="view-section-head view-section-head--players">
        <h2 class="view-section-title" id="headingPlayers">All Players</h2>
      </header>
      <div class="players-toolbar">
        <div class="players-search-group">
          <label class="player-search-label" for="playerSearch">Search player</label>
          <input type="search" id="playerSearch" class="player-search" placeholder="Search by player name…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="stat-filter-divider" aria-hidden="true"></div>
        <div class="stat-filter" role="group" aria-label="Filter by stat">
          <button type="button" class="stat-pill" data-stat="ALL" aria-pressed="true">All</button>
          <button type="button" class="stat-pill" data-stat="PTS" aria-pressed="false">Pts</button>
          <button type="button" class="stat-pill" data-stat="AST" aria-pressed="false">Ast</button>
          <button type="button" class="stat-pill" data-stat="REB" aria-pressed="false">Rebs</button>
        </div>
      </div>
      <div id="playersPanel"></div>
    </section>
  </div>
  <script src="slate.js?v=PAGES_ASSET_VERSION"></script>
</body>
</html>
