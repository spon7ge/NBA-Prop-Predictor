name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Update last updated timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -f docs/index.html ]; then
            sed -i "s/BUILD_TIMESTAMP/$TIMESTAMP/g" docs/index.html
          fi
      
      - name: Cache-bust slate assets (avoid stale CSS/JS on GitHub Pages)
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          for f in docs/*.html; do
            [ -f "$f" ] || continue
            sed -i "s/PAGES_ASSET_VERSION/$SHORT/g" "$f"
          done
      
      - name: Copy EV data (JSON slates + all line probs) to docs folder
        run: |
          mkdir -p docs/data/props/ev_analysis
          cp data/props/ev_analysis/prizepicks.json docs/data/props/ev_analysis/prizepicks.json
          cp data/props/ev_analysis/underdog.json docs/data/props/ev_analysis/underdog.json
          cp data/props/ev_analysis/all_line_probs.json docs/data/props/ev_analysis/all_line_probs.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4