name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Update last updated timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -f docs/index.html ]; then
            sed -i "s/BUILD_TIMESTAMP/$TIMESTAMP/g" docs/index.html
          fi
      
      - name: Cache-bust slate assets (avoid stale CSS/JS on GitHub Pages)
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          for f in docs/*.html; do
            [ -f "$f" ] || continue
            sed -i "s/PAGES_ASSET_VERSION/$SHORT/g" "$f"
          done
      
      - name: Copy EV data (JSON slates + Underdog enriched line probs) to docs folder
        run: |
          mkdir -p docs/data/props/ev_analysis
          cp data/props/ev_analysis/prizepicks.json docs/data/props/ev_analysis/prizepicks.json
          cp data/props/ev_analysis/underdog.json docs/data/props/ev_analysis/underdog.json
          cp data/props/ev_analysis/draftKings.json docs/data/props/ev_analysis/draftKings.json
          cp data/props/ev_analysis/betr.json docs/data/props/ev_analysis/betr.json
          if [ -f "data/props/ev_analysis/underdog_enriched.json" ]; then
            cp data/props/ev_analysis/underdog_enriched.json docs/data/props/ev_analysis/underdog_enriched.json
          fi
          # 3-leg slates (optional files are skipped if not present yet, e.g. betr_3leg.json)
          for f in prizepicks_3leg.json underdog_3leg.json draftKings_3leg.json betr_3leg.json; do
            if [ -f "data/props/ev_analysis/$f" ]; then
              cp "data/props/ev_analysis/$f" "docs/data/props/ev_analysis/$f"
            fi
          done
          # Copy latest dfs_enriched_* file for the All Players view
          mkdir -p docs/data/props/enriched
          latest=$(ls -t data/props/enriched/dfs_enriched_*.json 2>/dev/null | head -1)
          if [ -n "$latest" ]; then
            cp "$latest" "docs/data/props/enriched/$(basename $latest)"
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4