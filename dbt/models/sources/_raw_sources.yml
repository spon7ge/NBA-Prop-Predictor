version: 2

sources:
  - name: silver
    description: >
      Python-managed merged tables in the silver schema. Populated by
      src/utils/silver.py — these are NOT dbt-managed but serve as
      upstream inputs for silver dbt models.
    schema: silver
    tables:
      - name: player_gamelogs
        description: >
          Merged player-level gamelogs combining Base, Advanced, Tracking,
          and team-context stats per player per game. Populated by the
          Python silver pipeline before dbt runs.

  - name: ml
    description: >
      ML schema — model artifacts and predictions written by Python scripts.
      These tables are NOT dbt-managed but serve as upstream inputs for
      gold scoring models.
    schema: ml
    tables:
      - name: predictions
        description: >
          Quantile regression model outputs (Q50 stored as `prediction`).
          Written by scripts/generate_predictions.py after each slate.
          PK: (prop, game_id, player_id).
      - name: model_registry
        description: >
          Registry of trained model versions with metadata and joblib paths.
          PK: model_id (UUID).

  - name: raw
    description: Untouched scraper / API landing tables in the raw schema.
    schema: raw
    tables:
      - name: team_base
        description: NBA team box-score logs (one row per team per game).
      - name: player_base
        description: NBA player box-score logs (one row per player per game).
      - name: props_dfs
        description: DFS book player props (PrizePicks, Underdog, …).
      - name: props_us
        description: US sportsbook player props (DraftKings, FanDuel, …).
      - name: games
        description: Odds-API game events (home/away, commence time).
